name: baseline_hybrid
description: >
  Baseline hybrid pipeline using OpenAI text-embedding-3-small for three dense
  representations plus sparse keyword vectors, reranked with gpt-5-mini.

vector_store:
  collection_name: baseline_hybrid
  multivector: true
  named_vectors:
    definition:
      type: dense
      dim: 1536
    question:
      type: dense
      dim: 1536
    application:
      type: dense
      dim: 1536
    keywords:
      type: sparse

embedding:
  model: text-embedding-3-small
  dimensions: 1536

retrieval:
  search_limit: 15
  hybrid:
    mode: prefetch
    dense_weight: 0.6
    sparse_weight: 0.4

reranker:
  model: gpt-5-mini
  temperature: 0.0

preprocessing: []
postprocessing: []
